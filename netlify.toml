[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Les redirects SEO sont gérés par public/_redirects (généré à la racine du site).
# On s'assure que les règles _redirects sont bien traitées avant les fichiers.
[[redirects]]
  from = "/"
  to = "/fr/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Longue cache pour les images (noms de fichiers stables)
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
